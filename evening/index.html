<style>
/* Тёмно-синий зал и латунь: распашные двери, огни гирлянд, курсивная антиква. */
:root{
  --btn-line:var(--accent);--btn-fg:var(--accent);
  color-scheme:dark;
  --paper:#10182b; --ink:#efe6d2; --ink-soft:#a69d86; --line:#6d5f3c; --accent:#d2ab5f; --card:#18223b;
  --display:"Playfair Display",Georgia,serif;
  --body:"Tenor Sans","Trebuchet MS",sans-serif;
  --h1-size:clamp(3rem,15vw,4rem); --h2-size:2rem; --h-style:italic; --fs-body:1rem;
  --num-font:var(--display); --num-style:italic; --num-size:2.2rem;
  --h3-font:var(--display);
  --pill-bg:var(--accent); --pill-fg:#10182b;
  --card-shadow:inset 0 0 0 1px var(--line);
  --w-sky:#18223b; --w-leaf1:#1f2c4a; --w-leaf2:#0a1020; --w-water:#18223b; --w-bloom:#f0cf8a; --w-reed:#d2ab5f;
  --door-1:#16203a; --door-2:#0c1324;
  --bg-delay:1.55s;
}
h1 span:not(.amp){background:linear-gradient(180deg,#f3dfae,#c39a4e);-webkit-background-clip:text;background-clip:text;color:transparent}
.scene,.venue canvas{-webkit-mask-image:linear-gradient(180deg,transparent,#000 18%,#000 80%,transparent);mask-image:linear-gradient(180deg,transparent,#000 18%,#000 80%,transparent)}
.btn:hover{color:#10182b}
/* Двери зала: створки с филёнками на петлях, щель света между ними, за дверями тёплый зал. */
.opener .bg{background:radial-gradient(ellipse 80% 60% at 50% 45%,#16203a,#080d19)}
.hall{position:absolute;inset:0;margin-inline:auto;width:min(100%,34rem);perspective:1100px;perspective-origin:50% 46%;
  box-shadow:0 0 0 1px var(--accent),0 0 0 .55rem var(--door-2),0 0 0 calc(.55rem + 1px) var(--line),0 0 5rem rgba(0,0,0,.6);
  transition:transform 1.15s cubic-bezier(.55,0,.85,.5) 1.05s,opacity .6s ease 1.6s}
.glow{position:absolute;inset:0;overflow:hidden;
  background:radial-gradient(ellipse 95% 58% at 50% 50%,#fff4d6,#f3d594 22%,#c2924a 48%,#4a3820 76%,var(--paper))}
.glow::before{content:"";position:absolute;inset:0;filter:blur(1.5px);
  background:radial-gradient(circle at 22% 24%,rgba(255,241,201,.8) 0 .22rem,transparent .9rem),radial-gradient(circle at 74% 18%,rgba(255,241,201,.8) 0 .18rem,transparent .8rem),
    radial-gradient(circle at 86% 36%,rgba(255,241,201,.8) 0 .25rem,transparent 1rem),radial-gradient(circle at 12% 44%,rgba(255,241,201,.8) 0 .2rem,transparent .8rem),
    radial-gradient(circle at 36% 12%,rgba(255,241,201,.8) 0 .16rem,transparent .7rem),radial-gradient(circle at 62% 30%,rgba(255,241,201,.8) 0 .14rem,transparent .6rem)}
.glow::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26%;background:linear-gradient(180deg,transparent,rgba(16,24,43,.7))}
.door{position:absolute;top:0;bottom:0;width:50.1%;transition:transform 1.35s cubic-bezier(.55,.05,.25,1) .28s}
.door.l{left:0;transform-origin:0 50%;background:linear-gradient(90deg,var(--door-2),var(--door-1) 60%,#1b2747)}
.door.r{right:0;transform-origin:100% 50%;background:linear-gradient(270deg,var(--door-2),var(--door-1) 60%,#1b2747)}
.door::before{content:"";position:absolute;top:62%;width:.5rem;height:3.4rem;border-radius:.3rem;z-index:1;
  background:linear-gradient(90deg,#a57f3a,#f3dfae 45%,#a57f3a);box-shadow:.15rem .25rem .35rem rgba(0,0,0,.55)}
.door.l::before{right:.7rem}
.door.r::before{left:.7rem}
.door::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity 1s ease .5s;pointer-events:none}
.door.l::after{background:linear-gradient(90deg,transparent 25%,rgba(240,207,138,.4))}
.door.r::after{background:linear-gradient(270deg,transparent 25%,rgba(240,207,138,.4))}
.pan{position:absolute;border:1px solid var(--accent);background:linear-gradient(165deg,#0b1122,#131c33);
  box-shadow:inset .3rem .35rem .7rem rgba(0,0,0,.6),inset -1px -1px 0 rgba(239,230,210,.1),0 0 0 .4rem var(--door-1),0 0 0 calc(.4rem + 1px) var(--line),.12rem .14rem .1rem calc(.4rem + 1px) rgba(0,0,0,.35)}
.pan.a{top:1.7rem;height:calc(55% - 1.7rem)}
.pan.b{top:calc(55% + 1.5rem);bottom:1.7rem}
.door.l .pan{left:1.3rem;right:2rem}
.door.r .pan{left:2rem;right:1.3rem}
.door.l .pan.a{border-radius:min(7rem,34vw) 0 0 0}
.door.r .pan.a{border-radius:0 min(7rem,34vw) 0 0}
.mono{position:absolute;top:44%;width:4rem;height:8rem;margin-top:-4rem;z-index:1;display:flex;align-items:center;
  font-family:var(--display);font-style:italic;font-size:2.4rem;color:var(--accent);filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.door.l .mono{right:0;border-radius:4rem 0 0 4rem;justify-content:flex-end;padding-right:.6rem;
  background:radial-gradient(circle at 100% 50%,var(--door-2) 0 3.4rem,var(--accent) 3.4rem calc(3.4rem + 1px),var(--door-2) calc(3.4rem + 1px) 3.86rem,var(--line) 3.86rem calc(3.86rem + 1px),var(--door-2) calc(3.86rem + 1px))}
.door.r .mono{left:0;border-radius:0 4rem 4rem 0;padding-left:.6rem;
  background:radial-gradient(circle at 0 50%,var(--door-2) 0 3.4rem,var(--accent) 3.4rem calc(3.4rem + 1px),var(--door-2) calc(3.4rem + 1px) 3.86rem,var(--line) 3.86rem calc(3.86rem + 1px),var(--door-2) calc(3.86rem + 1px))}
.seam{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:linear-gradient(180deg,transparent,#ffe9b8 12%,#ffe9b8 88%,transparent);
  box-shadow:0 0 14px 3px rgba(240,207,138,.5);animation:breathe 3.4s ease-in-out infinite;transition:opacity .35s ease}
.hint{top:calc(44% + 5.6rem);color:var(--accent)}
.hint span{background:var(--door-1);padding:.2rem .6rem}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
.open .seam{animation:none;opacity:0}
.open .door.l{transform:rotateY(84deg)}
.open .door.r{transform:rotateY(-84deg)}
.open .door::after{opacity:1}
.open .hall{transform:scale(1.5);opacity:0}
</style>
</head>
<body>
<div class="opener" id="opener" data-ms="2450" role="button" tabindex="0" aria-label="Открыть приглашение">
  <div class="bg"></div>
  <div class="hall">
    <div class="glow"></div>
    <div class="door l"><i class="pan a"></i><i class="pan b"></i><b class="mono">Е</b></div>
    <div class="door r"><i class="pan a"></i><i class="pan b"></i><b class="mono">А</b></div>
    <div class="seam"></div>
  </div>
  <div class="hint"><span>Откройте двери</span></div>
</div>
<main class="letter" id="letter"></main>
