<style>
/* Бордо и крем: конверт из четырёх тиснёных клапанов с золотой печатью, антиква, календарь с отмеченным днём. */
:root{
  --paper:#f6ede4; --ink:#4a1420; --ink-soft:#8c6a66; --line:#d6bfb2; --accent:#8c1c2e; --card:#5e1424;
  --grain:var(--grain-url);
  --display:"Prata","Playfair Display",Georgia,serif;
  --body:"Cormorant Garamond","Cormorant",Georgia,serif;
  --h1-size:clamp(2.6rem,12.5vw,3.5rem); --h2-size:1.8rem; --h-lh:1.15; --fs-body:1.18rem;
  --num-font:var(--display); --num-style:normal; --num-size:2rem;
  --pill-bg:var(--accent); --pill-fg:#f6ede4;
  --card-shadow:0 14px 26px -18px rgba(74,20,32,.7);
  --w-sky:#f0dcd3; --w-leaf1:#8a9a78; --w-leaf2:#5d6f55; --w-water:#e6cfc4; --w-bloom:#8c1c2e; --w-reed:#6b4a3a;
  --env:#5e1424; --env-hi:#74202f; --env-lo:#460d19;
  --seal:#d9b36c; --seal-hi:#f6e2b0; --seal-lo:#a37a35;
  --cw:min(76vw,21rem,48vh);
  --bg-delay:1.95s;
}
.dress,.back,.plan.cards li{color:#f6ede4}
.plan.cards time{color:var(--seal)}
.dress .sw i{box-shadow:inset 0 0 0 1px rgba(246,237,228,.35)}
.cal{width:100%;max-width:19rem;display:grid;grid-template-columns:repeat(7,1fr);row-gap:.3rem;font-variant-numeric:lining-nums;line-height:1}
.cal strong{grid-column:1/-1;font-family:var(--display);font-weight:400;font-size:1.5rem;padding-bottom:.7rem}
.cal em{font-style:normal;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);padding-bottom:.4rem}
.cal span{display:grid;place-items:center;height:2.3rem;font-size:1.12rem}
.cal .on{position:relative;color:#f6ede4;font-weight:500}
.cal .on svg{position:absolute;left:50%;top:50%;width:2.5rem;height:2.5rem;margin:-1.2rem 0 0 -1.25rem;z-index:-1;fill:var(--accent)}
.cal .on{z-index:0}
/* Конверт: четыре клапана на петлях по краям, под ними карточка, сверху печать. */
.opener .bg{background:var(--grain-url),radial-gradient(ellipse 90% 70% at 50% 40%,#fbf5ee,var(--paper) 55%,#e3d0c2)}
.stage{position:absolute;inset:0;display:grid;place-items:center;perspective:1300px;animation:float 6s ease-in-out infinite;transition:opacity .5s ease 2.15s}
.stage::after{content:"";position:absolute;left:50%;top:50%;width:calc(var(--cw) * .9);height:2.2rem;margin:calc(var(--cw) * .72) 0 0 calc(var(--cw) * -.45);
  border-radius:50%;background:rgba(74,20,32,.35);filter:blur(14px);transition:opacity .5s ease .5s}
.env4{position:relative;width:var(--cw);aspect-ratio:5/7;transform-style:preserve-3d;
  transform:rotateX(calc(14deg + var(--rx,0deg))) rotateY(var(--ry,0deg)) rotateZ(-2deg);transition:transform .35s ease-out}
.env4>*{position:absolute;inset:0}
.e-card{border-radius:.12rem;background:var(--grain-url),linear-gradient(180deg,#fffaf2,#f5eadc);
  box-shadow:inset 0 0 0 1px #c9a86a,inset 0 0 0 .4rem #fffaf2,inset 0 0 0 calc(.4rem + 1px) #e2cfa6,0 1.4rem 2.2rem -1rem rgba(74,20,32,.6);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.8rem;text-align:center;color:var(--ink)}
.e-card small{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft)}
.e-card b{font-family:var(--display);font-weight:400;font-size:calc(var(--cw) * .115);line-height:1.2}
.e-card b i{font-style:normal;font-size:.6em;color:var(--accent)}
.e-card span{font-size:.85rem;letter-spacing:.2em}
.fp{transform-style:preserve-3d;transition:transform 1s cubic-bezier(.5,.05,.3,1)}
.fp>*{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fp .in{background:repeating-linear-gradient(45deg,#e6cc98 0 6px,#d3b473 6px 7px)}
.rel{position:absolute;inset:0;width:100%;height:100%}
.fp.l{transform-origin:0 50%;transform:translateZ(2px);transition-delay:.8s}
.fp.r{transform-origin:100% 50%;transform:translateZ(2px);transition-delay:.8s}
.fp.b{transform-origin:50% 100%;transform:translateZ(3px);transition-delay:.55s}
.fp.t{transform-origin:50% 0;transform:translateZ(4px);transition-delay:.3s}
.fp.l .out{clip-path:polygon(0 0,50.5% 50%,0 100%);background:linear-gradient(90deg,var(--env-lo),var(--env) 80%)}
.fp.r .out{clip-path:polygon(100% 0,49.5% 50%,100% 100%);background:linear-gradient(270deg,var(--env-lo),var(--env) 80%)}
.fp.b .out{clip-path:polygon(0 100%,50% 49.5%,100% 100%);background:linear-gradient(0deg,var(--env),var(--env-hi))}
.fp.t .out{clip-path:polygon(0 0,100% 0,50% 50.5%);background:linear-gradient(180deg,var(--env-hi),var(--env) 70%,var(--env-lo))}
.fp.l .in{clip-path:polygon(100% 0,49.5% 50%,100% 100%);transform:rotateY(180deg)}
.fp.r .in{clip-path:polygon(0 0,50.5% 50%,0 100%);transform:rotateY(180deg)}
.fp.b .in{clip-path:polygon(0 0,50% 50.5%,100% 0);transform:rotateX(180deg)}
.fp.t .in{clip-path:polygon(0 100%,100% 100%,50% 49.5%);transform:rotateX(180deg)}
.seal{inset:auto;left:50%;top:50%;width:5.2rem;height:5.2rem;margin:-2.6rem 0 0 -2.6rem;transform:translateZ(7px);filter:drop-shadow(0 4px 5px rgba(30,0,8,.55))}
.half{position:absolute;inset:0;transition:transform .7s cubic-bezier(.3,.7,.3,1),opacity .55s ease .15s}
.half.a{clip-path:polygon(0 0,54% 0,47% 18%,55% 34%,46% 52%,54% 70%,47% 86%,52% 100%,0 100%)}
.half.b{clip-path:polygon(54% 0,100% 0,100% 100%,52% 100%,47% 86%,54% 70%,46% 52%,55% 34%,47% 18%)}
.wax{position:absolute;inset:0;border-radius:49% 51% 50% 50% / 52% 48% 52% 48%;
  background:radial-gradient(circle at 34% 28%,var(--seal-hi),transparent 46%),radial-gradient(circle at 70% 78%,var(--seal-lo),transparent 55%),var(--seal);
  box-shadow:inset 0 0 0 .36rem var(--seal),inset .1rem .12rem .18rem .36rem var(--seal-lo),inset -.08rem -.1rem .18rem .4rem var(--seal-hi);
  display:grid;place-items:center;font-family:var(--display);font-size:1.45rem;letter-spacing:.04em;line-height:1;color:var(--seal);
  text-shadow:1px 1.4px .5px #8a6426,-1px -1px .5px var(--seal-hi)}
.hint{top:calc(50% + var(--cw) * .7 + 2.6rem);color:var(--ink);opacity:.8}
@keyframes float{50%{transform:translateY(-.45rem)}}
.open .stage::after{opacity:0}
.open .half.a{transform:translate(-1.7rem,1.1rem) rotate(-16deg);opacity:0}
.open .half.b{transform:translate(1.7rem,1.1rem) rotate(16deg);opacity:0}
.open .fp.t{transform:translateZ(4px) rotateX(168deg)}
.open .fp.b{transform:translateZ(3px) rotateX(-168deg)}
.open .fp.l{transform:translateZ(2px) rotateY(-168deg)}
.open .fp.r{transform:translateZ(2px) rotateY(168deg)}
.open .env4{transform:scale(2.1) rotateX(0deg);transition:transform .85s cubic-bezier(.6,0,.8,.4) 1.85s}
.open .stage{opacity:0}
</style>

<script>
/* Календарь месяца свадьбы с отмеченным днём: строится из даты, чтобы не править вручную. */
function calendar(iso) {
  const d = new Date(iso), y = d.getFullYear(), m = d.getMonth(), day = d.getDate();
  const first = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  const name = new Date(y, m, 1).toLocaleDateString('ru-RU', {month: 'long'});
  const heart = '<svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 28C6 20 2 15 2 10a7 7 0 0 1 14-2 7 7 0 0 1 14 2c0 5-4 10-14 18Z"/></svg>';
  let h = '<div class="cal" role="img" aria-label="Календарь: ' + day + ' число отмечено"><strong>' + name[0].toUpperCase() + name.slice(1) + ' ' + y + '</strong>' +
    ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].map(w => '<em>' + w + '</em>').join('') + '<span></span>'.repeat(first);
  for (let i = 1; i <= days; i++) h += i === day ? '<span class="on">' + heart + i + '</span>' : '<span>' + i + '</span>';
  return h + '</div>';
}
const DATE = '2027-10-09T15:30:00+03:00';
window.INVITE = {
  names: ['София', 'Марк'], joiner: 'и',
  date: DATE, dateFormat: 'long',
  art: 'html', artHtml: calendar(DATE),
  lead: 'Дорогие родные и друзья! Мы решили, что этой осенью станем семьёй, и приглашаем вас быть с нами в этот день.',
  titles: {count: 'До свадьбы', place: 'Место', plan: 'Программа дня', dress: 'Дресс-код'},
  venues: [
    {kind: 'ceremony', title: 'Церемония', time: '15:30', place: 'Оранжерея', address: 'Адрес сообщим позже'},
    {title: 'Банкет', time: '17:30', place: 'Каминный зал', address: 'Там же, вход со двора'}
  ],
  plan: [['15:00', 'Сбор гостей'], ['15:30', 'Церемония'], ['16:30', 'Фуршет и фотографии'], ['17:30', 'Банкет'], ['20:30', 'Торт'], ['21:30', 'Танцы']],
  dress: 'Будем рады оттенкам вина, пыльной розы и сливок. Мужчинам подойдут тёмные костюмы.',
  swatches: ['#5e1424', '#8c1c2e', '#c98a8f', '#e9d6c4', '#3a3a34'],
  sections: ['lead', 'venues', {type: 'plan', as: 'cards'}, 'dress',
    {type: 'list', title: 'Пожелания', items: [
      ['Цветы', 'Мы улетаем на следующий день и не успеем ими насладиться. Вместо букета порадуйте нас открыткой с тёплыми словами.'],
      ['Подарки', 'Лучшим подарком станет вклад в наше свадебное путешествие.'],
      ['Дети', 'Будем рады видеть вас с детьми: для них готовим отдельный стол.']]}],
  bye: 'С любовью и нетерпением ждём встречи.'
};
</script>
