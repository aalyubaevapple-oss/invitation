<style>
/* Пудровый конверт с сургучной печатью: каллиграфия, тонкие линейки, акварельный берег. */
:root{
  --paper:#f4dfe3; --ink:#4b3340; --ink-soft:#8a6b78; --line:#d3a9b6; --accent:#b0607a; --card:#f9ebe6;
  --grain:var(--grain-url);
  --display:"Great Vibes","Marck Script","Snell Roundhand",cursive;
  --body:"Cormorant","Cormorant Garamond",Georgia,serif;
  --h1-size:clamp(3.4rem,17vw,4.6rem); --h2-size:2.7rem; --fs-body:1.16rem;
  --card-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(60,30,40,.5);
  --env-1:#e6c4cb; --env-2:#efd3d8; --env-3:#d9b1bb;
  --seal:#ecc9a2; --seal-hi:#fbe6c9; --seal-lo:#c99a6b;
  --w-sky:#f3c9cf; --w-leaf1:#9bb38a; --w-leaf2:#6f8f6c; --w-water:#b9cfd6; --w-bloom:#e58fa6; --w-reed:#5e6f4c;
  --bg-delay:2.05s;
}
/* Объёмный конверт: задняя стенка, карточка, карман, клапан с двумя сторонами и печать лежат на разной глубине. */
.opener .bg{background:var(--grain-url),radial-gradient(ellipse 90% 70% at 50% 38%,#fbeff1,var(--paper) 58%,#e4c3ca)}
.stage{position:absolute;inset:0;display:grid;place-items:center;perspective:1300px;animation:float 5.5s ease-in-out infinite}
.stage::after{content:"";position:absolute;left:50%;top:50%;width:min(70vw,19rem);height:2.2rem;margin:calc(min(84vw,23rem) * .42) 0 0 calc(min(70vw,19rem) / -2);
  border-radius:50%;background:rgba(75,40,55,.28);filter:blur(14px);transition:opacity .6s ease 1.9s}
.env3{position:relative;width:min(84vw,23rem);aspect-ratio:10/7;transform-style:preserve-3d;
  transform:rotateX(calc(16deg + var(--rx,0deg))) rotateY(var(--ry,0deg)) rotateZ(-2deg);
  transition:transform .35s ease-out,opacity .6s ease}
.env3>*{position:absolute;inset:0}
.e-back{background:repeating-linear-gradient(45deg,#c98b9c 0 7px,#c2818f 7px 14px);border-radius:.25rem;box-shadow:0 1.2rem 2rem -1rem rgba(75,40,55,.55)}
.e-card{inset:5% 4.5% 4%;transform:translateZ(1px);border-radius:.15rem;
  background:var(--grain-url),linear-gradient(180deg,#fffaf3,#f7ecdf);
  box-shadow:inset 0 0 0 1px #d9b98a,inset 0 0 0 .32rem #fffaf3,inset 0 0 0 calc(.32rem + 1px) #e6cfa6,0 2px 6px rgba(75,40,55,.25);
  display:flex;flex-direction:column;align-items:center;gap:.25rem;padding-top:1.5rem;color:var(--ink);
  transition:transform 1s cubic-bezier(.3,.8,.3,1) 1.15s}
.e-card small{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft)}
.e-card b{font-family:var(--display);font-weight:400;font-size:clamp(1.9rem,9vw,2.5rem);line-height:1.1}
.e-card span{font-size:.85rem;letter-spacing:.22em}
.e-front{transform:translateZ(2px)}
.e-front i{position:absolute;inset:0}
.e-front i::after,.f-out::after{content:"";position:absolute;inset:0;background-image:var(--grain-url)}
.e-front .l{clip-path:polygon(0 0,50.5% 54%,0 100%);background:linear-gradient(90deg,var(--env-3),var(--env-1) 75%)}
.e-front .r{clip-path:polygon(100% 0,49.5% 54%,100% 100%);background:linear-gradient(270deg,var(--env-3),var(--env-1) 75%)}
.e-front .b{clip-path:polygon(0 100%,50% 46%,100% 100%);background:linear-gradient(0deg,var(--env-1),var(--env-2) 80%);filter:drop-shadow(0 -2px 3px rgba(75,40,55,.25))}
.e-shade{transform:translateZ(2.5px) translateY(5px);clip-path:polygon(0 0,100% 0,50% 60%);background:rgba(75,40,55,.3);filter:blur(5px);transition:opacity .4s ease .35s}
.e-flap{transform:translateZ(3px) rotateX(0deg);transform-origin:50% 0;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.5,.05,.3,1) .35s}
.e-flap>*{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.f-out{clip-path:polygon(0 0,100% 0,50% 58%);background:linear-gradient(180deg,var(--env-2),var(--env-1) 70%,var(--env-3))}
.f-in{clip-path:polygon(0 100%,100% 100%,50% 42%);transform:rotateX(180deg);background:repeating-linear-gradient(45deg,#c98b9c 0 7px,#c2818f 7px 14px)}
.seal{inset:auto;left:50%;top:58%;width:5.4rem;height:5.4rem;margin:-2.7rem 0 0 -2.7rem;transform:translateZ(6px);
  filter:drop-shadow(0 4px 5px rgba(60,30,40,.4))}
.half{position:absolute;inset:0;transition:transform .7s cubic-bezier(.3,.7,.3,1),opacity .55s ease .15s}
.half.a{clip-path:polygon(0 0,54% 0,47% 18%,55% 34%,46% 52%,54% 70%,47% 86%,52% 100%,0 100%)}
.half.b{clip-path:polygon(54% 0,100% 0,100% 100%,52% 100%,47% 86%,54% 70%,46% 52%,55% 34%,47% 18%)}
.wax{position:absolute;inset:0;border-radius:48% 52% 50% 50% / 52% 47% 53% 48%;
  background:radial-gradient(circle at 34% 28%,var(--seal-hi),transparent 46%),radial-gradient(circle at 70% 78%,var(--seal-lo),transparent 55%),var(--seal);
  box-shadow:inset 0 0 0 .38rem var(--seal),inset .1rem .12rem .18rem .38rem var(--seal-lo),inset -.08rem -.1rem .18rem .42rem var(--seal-hi);
  display:grid;place-items:center;font-family:var(--display);font-size:1.85rem;line-height:1;color:var(--seal);
  text-shadow:1px 1.2px .5px var(--seal-lo),-1px -1px .5px var(--seal-hi)}
.hint{top:calc(50% + min(84vw,23rem) * .35 + 3.4rem);color:var(--ink);opacity:.75}
@keyframes float{50%{transform:translateY(-.5rem)}}
.open .stage::after{opacity:0}
.open .half.a{transform:translate(-1.7rem,1.1rem) rotate(-16deg);opacity:0}
.open .half.b{transform:translate(1.7rem,1.1rem) rotate(16deg);opacity:0}
.open .e-shade{opacity:0}
.open .e-flap{transform:translateZ(-1px) rotateX(180deg)}
.open .e-card{transform:translateZ(1px) translateY(-72%)}
.open .env3{transform:translateY(50%) scale(1.2) rotateX(16deg) rotateZ(-2deg);transition:transform .8s cubic-bezier(.6,0,.8,.4) 2.05s}
.stage{transition:opacity .5s ease 2.25s}
.open .stage{opacity:0}
</style>
</head>
<body>
<div class="opener" id="opener" data-ms="2800" role="button" tabindex="0" aria-label="Открыть приглашение">
  <div class="bg"></div>
  <div class="stage">
    <div class="env3" id="env3">
      <div class="e-back"></div>
      <div class="e-card"><small>Приглашение</small><b>Анна и Михаил</b><span>17 · 07 · 2027</span></div>
      <div class="e-front"><i class="l"></i><i class="r"></i><i class="b"></i></div>
      <div class="e-shade"></div>
      <div class="e-flap"><div class="f-out"></div><div class="f-in"></div></div>
      <div class="seal">
        <span class="half a"><span class="wax">АМ</span></span>
        <span class="half b"><span class="wax">АМ</span></span>
      </div>
    </div>
  </div>
  <div class="hint">Нажмите на печать</div>
</div>
<main class="letter" id="letter"></main>
<script>
window.INVITE = {
  names: ['Анна', 'Михаил'], joiner: 'и',
  date: '2027-07-17T16:00:00+03:00',
  art: 'river', seed: 11, artLabel: 'Акварельный берег реки с лодкой',
  lead: 'Дорогие родные и друзья! В этот день мы станем семьёй и очень хотим, чтобы вы были рядом.',
  venues: [
    {kind: 'ceremony', title: 'Церемония', time: '16:00', place: 'Площадка у воды', address: 'Адрес сообщим позже'},
    {kind: 'dinner', title: 'Ужин', time: '18:00', place: 'Шатёр в саду', address: 'Там же, в двух минутах пешком'}
  ],
  plan: [['15:30', 'Сбор гостей'], ['16:00', 'Церемония у воды'], ['17:00', 'Фуршет и прогулка'], ['18:00', 'Праздничный ужин'], ['21:00', 'Торт'], ['22:00', 'Танцы и огни']],
  dress: 'Будем рады, если ваши наряды поддержат палитру праздника. Удобная обувь пригодится: часть вечера пройдёт на траве.',
  swatches: ['#f1d5da', '#d9a3b2', '#b9c4a6', '#e9d3b4', '#8a6b78'],
  bye: 'Ждём вас и будем счастливы разделить этот день вместе.'
};
</script>
<script src="../assets/engine.js"></script>
<script>
/* Конверт слегка поворачивается за указателем, пока закрыт. */
(() => {
  const op = document.getElementById('opener'), env = document.getElementById('env3');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  op.addEventListener('pointermove', e => {
    if (op.classList.contains('open')) return;
    env.style.setProperty('--ry', ((e.clientX / innerWidth - .5) * 14).toFixed(1) + 'deg');
    env.style.setProperty('--rx', ((.5 - e.clientY / innerHeight) * 10).toFixed(1) + 'deg');
  });
})();
</script>
</body>
