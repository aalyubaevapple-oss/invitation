/* Детские фото-наклейки, сердце на ниточке и рукописные буквы: приглашение с улыбкой. */
:root{
  --btn-line:var(--accent);--btn-bg:var(--accent);--btn-fg:#fff6e0;
  --paper:#fff6e0; --ink:#2a2622; --ink-soft:#7d7264; --line:#e7d6b4; --accent:#cf2459; --accent-2:#2f4fa8; --card:#fffdf6;
  --display:"Pangolin","Caveat",cursive;
  --hand:"Caveat","Pangolin",cursive;
  --body:"Nunito","Helvetica Neue",Arial,sans-serif;
  --h1-size:clamp(3.2rem,16vw,4.2rem); --h2-size:2.1rem; --h-lh:1.05; --fs-body:1.02rem; --label-spacing:.16em;
  --date-font:var(--hand); --date-size:2.3rem; --date-weight:700; --date-spacing:.02em;
  --num-font:var(--display); --num-style:normal; --num-size:2.2rem;
  --h3-font:var(--hand); --h3-style:normal; --h3-weight:700;
  --pill-bg:var(--accent); --pill-fg:#fff6e0; --radius:1.2rem; --sign-size:2.4rem;
  --card-shadow:0 0 0 2px var(--accent),.35rem .35rem 0 var(--accent);
}
h1 span:nth-child(3){color:var(--accent-2)}
h1 span:nth-child(1){color:var(--accent)}
h1 .amp{color:var(--ink);font-family:var(--hand)}
.venue h3{font-size:1.9rem}
.label{font-family:var(--hand);font-size:1.25rem;text-transform:none;letter-spacing:.02em}
.count,.count div+div{border-color:var(--ink)}
.count{border-block-style:dashed;border-block-width:2px}
.count div+div{border-left-style:dashed;border-left-width:2px}
.plan::before{border-left:2px dashed var(--ink)}
.rule{color:var(--ink)}
.rule::before,.rule::after{border-top:2px dashed currentColor}
.rule i{width:auto;height:auto;background:none;transform:none;font-style:normal;color:var(--accent);font-size:1.3rem;line-height:1}
.rule i::before{content:"♥"}
.pair{display:flex;justify-content:center;align-items:flex-end;width:100%;margin-block:.4rem}
.pair svg{width:46%;height:auto;overflow:visible}
.pair svg:first-child{transform:rotate(-4deg);margin-right:-4%}
.pair svg:last-child{transform:rotate(3deg)}
.btn:hover{background:var(--ink);border-color:var(--ink);color:#fff6e0}
.cap2{font-family:var(--hand);font-size:1.3rem;color:var(--ink-soft);margin-top:-.4rem}

/* экран открытия */
.opener .bg{background:var(--paper)}
.opener.open{opacity:0;transition:opacity .45s ease .8s}
.string{position:absolute;left:0;top:0;width:100%;height:9rem;overflow:visible}
.string path{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;vector-effect:non-scaling-stroke}
.heart{position:absolute;left:50%;top:5.1rem;width:4.4rem;height:4.4rem;margin-left:-2.2rem;z-index:3;
  animation:beat 1.5s ease-in-out infinite;transition:transform .85s cubic-bezier(.7,0,.8,.4)}
.heart svg{width:100%;height:100%;fill:var(--accent);display:block}
.word{position:absolute;left:0;right:0;top:30%;text-align:center;font-family:var(--display);font-size:clamp(2.6rem,13vw,3.4rem);color:var(--ink);line-height:1}
.hint{top:calc(30% + 4.6rem);font-family:var(--hand);font-size:1.25rem;letter-spacing:.02em;text-transform:none;color:var(--ink-soft)}
.opener .pair{position:absolute;left:50%;bottom:3rem;margin:0 0 0 calc(min(100%,27rem) / -2);width:min(100%,27rem);padding-inline:.5rem}
.opener .pair svg{animation:pop .7s cubic-bezier(.3,1.5,.5,1) both}
.opener .pair svg:last-child{animation-delay:.15s}
.tape{position:absolute;left:0;right:0;bottom:0;height:3.2rem;background:var(--accent);color:var(--paper);overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:content-box;display:flex;align-items:center;z-index:2}
.tape div{display:flex;gap:2.4rem;white-space:nowrap;font-family:var(--hand);font-size:1.5rem;animation:run 16s linear infinite;padding-left:2.4rem}
@keyframes run{to{transform:translateX(-50%)}}
@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.13)}24%{transform:scale(1)}36%{transform:scale(1.09)}}
@keyframes pop{from{transform:translateY(60%) scale(.7);opacity:0}}
.open .heart{animation:none;transform:scale(48)}
</style>
</head>
