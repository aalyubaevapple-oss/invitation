<style>
/* Карточка, сложенная вдвое и перевязанная лентой: мох, вода, латунь. */
:root{
  --paper:#e8ecdd; --ink:#2e3a2f; --ink-soft:#66755f; --line:#aab89a; --accent:#5f7a4a; --card:#f1f3e6;
  --grain:var(--grain-url);
  --display:"Marck Script","Great Vibes",cursive;
  --body:"Lora",Georgia,serif;
  --h1-size:clamp(3.1rem,15vw,4.1rem); --h2-size:2.3rem; --fs-body:1.02rem;
  --num-style:normal; --num-size:2rem;
  --card-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(30,50,30,.5);
  --w-sky:#dfe6d2; --w-leaf1:#8fa878; --w-leaf2:#55724f; --w-water:#a8c5c4; --w-bloom:#f6efd6; --w-reed:#4c5f3d;
  --ribbon:#b79a5c; --ribbon-hi:#dcc68d; --ribbon-lo:#8f7541; --fold:#d6dec8;
  --bg-delay:2.05s;
}
/* Сложенная вдвое карточка лежит на столе: створки, атласная лента с бантом и веточка под ней на разной глубине. */
:root{--cw:min(74vw,22rem,46vh)}
.opener .bg{background:var(--grain-url),radial-gradient(ellipse 90% 70% at 50% 40%,#f3f6e9,var(--paper) 55%,#c9d3b8)}
.stage{position:absolute;inset:0;display:grid;place-items:center;perspective:1300px;animation:float 6s ease-in-out infinite;transition:opacity .5s ease 2.25s}
.stage::after{content:"";position:absolute;left:50%;top:50%;width:calc(var(--cw) * .9);height:2.2rem;margin:calc(var(--cw) * .72) 0 0 calc(var(--cw) * -.45);
  border-radius:50%;background:rgba(30,50,30,.3);filter:blur(14px);transition:opacity .5s ease .8s}
.fold{position:relative;width:var(--cw);aspect-ratio:5/7;transform-style:preserve-3d;
  transform:rotateX(calc(14deg + var(--rx,0deg))) rotateY(var(--ry,0deg)) rotateZ(2deg);transition:transform .35s ease-out}
.fold>*{position:absolute}
.f-inner{inset:0;border-radius:.12rem;background:var(--grain-url),linear-gradient(180deg,#fcfbf2,#f1f0df);
  box-shadow:inset 0 0 0 1px var(--line),inset 0 0 0 .4rem #fcfbf2,inset 0 0 0 calc(.4rem + 1px) #cfd8bf,0 1.4rem 2.2rem -1rem rgba(30,50,30,.55);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;text-align:center;color:var(--ink)}
.f-inner small,.flap small{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft)}
.f-inner b{font-family:var(--display);font-weight:400;font-size:calc(var(--cw) * .17);line-height:1.05}
.f-inner span{font-size:.8rem;letter-spacing:.16em}
.flap{left:0;right:0;height:50%;transform-style:preserve-3d;transition:transform 1s cubic-bezier(.5,.05,.3,1)}
.flap.top{top:0;transform-origin:50% 0;transform:translateZ(2px);transition-delay:.85s}
.flap.bot{bottom:0;transform-origin:50% 100%;transform:translateZ(2px);transition-delay:1s}
.flap>*{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center}
.flap .out{background:var(--grain-url),linear-gradient(180deg,#e2e8d4,var(--fold))}
.flap .out::before{content:"";position:absolute;inset:.6rem;border:1px solid var(--line)}
.flap.top .out{box-shadow:inset 0 -12px 14px -12px rgba(30,50,30,.45)}
.flap.top .out::before{bottom:0;border-bottom:0}
.flap.bot .out{background:var(--grain-url),linear-gradient(0deg,#e2e8d4,var(--fold));box-shadow:inset 0 12px 14px -12px rgba(30,50,30,.3)}
.flap.bot .out::before{top:0;border-top:0}
.flap.top small{margin-top:-2.2rem}
.flap.bot b{margin-top:2.6rem;font-family:var(--display);font-weight:400;font-size:calc(var(--cw) * .13);line-height:1;color:var(--ink)}
.flap .in{transform:rotateX(180deg);background:var(--grain-url),linear-gradient(180deg,#f6f5e8,#eceadb)}
.sprig{left:6%;top:50%;width:86%;margin-top:calc(var(--cw) * -.3);transform:translateZ(3px) rotate(-6deg);overflow:visible;
  filter:drop-shadow(0 2px 2px rgba(30,40,20,.3));transition:transform .9s cubic-bezier(.5,0,.8,.5) .45s,opacity .5s ease .75s}
.rib{left:0;right:0;top:50%;height:2rem;margin-top:-1rem;transform:translateZ(4px);transform-style:preserve-3d}
.rib i{position:absolute;top:0;bottom:0;width:50%;
  background:linear-gradient(180deg,var(--ribbon-hi),var(--ribbon) 38%,var(--ribbon-lo) 78%,#a88c50);box-shadow:0 3px 5px rgba(30,40,20,.35);
  transition:transform .75s cubic-bezier(.6,0,.5,1) .4s,opacity .35s ease .8s}
.rib i:nth-child(1){left:0;background-image:linear-gradient(90deg,rgba(60,45,15,.35),transparent 9%),linear-gradient(180deg,var(--ribbon-hi),var(--ribbon) 38%,var(--ribbon-lo) 78%,#a88c50)}
.rib i:nth-child(2){right:0;background-image:linear-gradient(270deg,rgba(60,45,15,.35),transparent 9%),linear-gradient(180deg,var(--ribbon-hi),var(--ribbon) 38%,var(--ribbon-lo) 78%,#a88c50)}
.bow{position:absolute;left:50%;top:50%;width:10.4rem;margin:-3.12rem 0 0 -5.2rem;transform:translateZ(5px);overflow:visible;filter:drop-shadow(0 3px 3px rgba(30,40,20,.4))}
.bow .loop,.bow .tails,.bow .knot{transform-box:fill-box;transition:transform .45s cubic-bezier(.5,0,.6,1),opacity .3s ease .25s}
.bow .loop.l{transform-origin:100% 62%}
.bow .loop.r{transform-origin:0 62%}
.bow .tails{transform-origin:50% 0;transition-delay:.15s,.4s}
.bow .knot{transform-origin:50% 50%;transition-delay:.3s,.45s}
.hint{top:calc(50% + var(--cw) * .7 + 2.6rem);color:var(--ink);opacity:.8}
@keyframes float{50%{transform:translateY(-.45rem)}}
.open .stage::after{opacity:0}
.open .bow .loop{transform:scale(.05,.3);opacity:0}
.open .bow .tails{transform:scaleY(1.5);opacity:0}
.open .bow .knot{transform:scale(.2);opacity:0}
.open .rib i:nth-child(1){transform:translateX(-115%);opacity:0}
.open .rib i:nth-child(2){transform:translateX(115%);opacity:0}
.open .sprig{transform:translateZ(3px) translate(-18%,160%) rotate(-38deg);opacity:0}
.open .flap.top{transform:translateZ(2px) rotateX(172deg)}
.open .flap.bot{transform:translateZ(2px) rotateX(-172deg)}
.open .fold{transform:scale(2.1) rotateX(0deg);transition:transform .85s cubic-bezier(.6,0,.8,.4) 1.95s}
.open .stage{opacity:0}
</style>
