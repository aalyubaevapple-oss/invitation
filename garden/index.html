<style>
/* Письмо, сложенное вдвое и перевязанное лентой: мох, вода, латунь. */
:root{
  --paper:#e8ecdd; --ink:#2e3a2f; --ink-soft:#66755f; --line:#aab89a; --accent:#5f7a4a; --card:#f1f3e6;
  --grain:var(--grain-url);
  --display:"Marck Script","Great Vibes",cursive;
  --body:"Lora",Georgia,serif;
  --h1-size:clamp(3.1rem,15vw,4.1rem); --h2-size:2.3rem; --fs-body:1.02rem;
  --num-style:normal; --num-size:2rem;
  --card-shadow:0 1px 0 var(--line),0 10px 24px -18px rgba(30,50,30,.5);
  --w-sky:#dfe6d2; --w-leaf1:#8fa878; --w-leaf2:#55724f; --w-water:#a8c5c4; --w-bloom:#f6efd6; --w-reed:#4c5f3d;
  --ribbon:#b79a5c; --ribbon-lo:#8f7541; --fold:#d6dec8;
  --bg-delay:.9s;
}
.pn{position:absolute;left:0;right:0;height:50.2%;background:var(--grain-url),var(--fold);
  display:grid;place-items:center;transition:transform 1.1s cubic-bezier(.6,.05,.3,1) .55s,opacity .5s ease 1.2s;backface-visibility:hidden}
.pn.top{top:0;transform-origin:50% 0;box-shadow:inset 0 -14px 18px -14px rgba(30,50,30,.35)}
.pn.bot{bottom:0;transform-origin:50% 100%;box-shadow:inset 0 14px 18px -14px rgba(30,50,30,.35)}
.pn b{font-family:var(--display);font-weight:400;font-size:clamp(2.6rem,13vw,3.6rem);color:var(--ink);line-height:1}
.pn.top b{margin-top:-2.4rem}
.pn.bot span{margin-top:3.2rem;font-size:.78rem;letter-spacing:.3em;text-transform:uppercase;color:var(--ink-soft)}
.rib{position:absolute;left:0;right:0;top:50%;height:2.3rem;margin-top:-1.15rem;
  background:linear-gradient(180deg,var(--ribbon),var(--ribbon-lo));box-shadow:0 3px 6px rgba(30,40,20,.3);
  transition:transform .7s cubic-bezier(.6,0,.4,1)}
.bow{position:absolute;left:50%;top:50%;width:0;height:0}
.bow i{position:absolute;width:4.6rem;height:2.9rem;top:-1.45rem;border-radius:60% 40% 40% 60% / 55% 45% 55% 45%;
  background:radial-gradient(ellipse at 60% 50%,transparent 38%,var(--ribbon) 40%),var(--ribbon-lo);
  box-shadow:0 3px 5px rgba(30,40,20,.3)}
.bow i:nth-child(1){right:.5rem;transform:rotate(-12deg)}
.bow i:nth-child(2){left:.5rem;transform:rotate(192deg)}
.bow u{position:absolute;width:1.5rem;height:1.9rem;left:-.75rem;top:-.95rem;border-radius:.4rem;background:var(--ribbon);box-shadow:inset 0 0 0 1px var(--ribbon-lo)}
.hint{top:calc(50% + 6.8rem);color:var(--ink)}
.open .rib{transform:translateX(115%)}
.open .pn.top{transform:rotateX(-112deg);opacity:0}
.open .pn.bot{transform:rotateX(112deg);opacity:0}
</style>
</head>
<body>
<div class="opener" id="opener" data-ms="1900" role="button" tabindex="0" aria-label="Открыть приглашение">
  <div class="bg"></div>
  <div class="pn top"><b>Вера и Глеб</b></div>
  <div class="pn bot"><span>Приглашение</span></div>
  <div class="rib"><div class="bow"><i></i><i></i><u></u></div></div>
  <div class="hint">Развяжите ленту</div>
</div>

};
</script>
